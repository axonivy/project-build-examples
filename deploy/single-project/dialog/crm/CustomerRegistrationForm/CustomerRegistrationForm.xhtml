<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="jakarta.faces.core"
	xmlns:h="jakarta.faces.html"
	xmlns:ui="jakarta.faces.facelets"
	xmlns:ic="http://ivyteam.ch/jsf/component"
	xmlns:p="primefaces"
	xmlns:pe="primefaces.extensions"
	>
<h:body>
	<ui:composition template="/layouts/frame.xhtml">
		<ui:define name="title">CustomerRegistrationForm</ui:define>
		<ui:define name="content">
			<h3>New Customer</h3>
			
			<h:form id="form">
				<h:panelGrid columns="2">
					<f:facet name="header">
						<p:messages></p:messages>
					</f:facet>
					
					
					<p:outputLabel for="firstname" value="Firstname"/>
					<p:inputText id="firstname" value="#{data.customer.firstname}"/>
					
					<p:outputLabel for="lastname" value="Lastname"/>
					<p:inputText id="lastname" value="#{data.customer.lastname}"/>
					
					<br />
					<p:commandButton actionListener="#{logic.close}" value="Register" update="form" icon="ti ti-check" />
				</h:panelGrid>
			</h:form>
			
		</ui:define>
	</ui:composition>
</h:body>
</html>
